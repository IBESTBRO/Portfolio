<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container{
            display: flex;
        }

        .box{
            margin: 10px;
        }
        
        #box-2{
            background-color: black;
            height: 900px;
            width: 100%;
        }

        #box-1{
            background-color: blue;
            height: 200px;
            width: 100%;
        }

        #box-3{
            background-color: rgb(63, 113, 52);
            height: 900px;
            width: 100%;
        }

        #box-4{
            background-color: rgb(111, 111, 111);
            
            height: 900px;
            width: 100%;
        }  
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box-1"></div>
        
    </div>
    <div class="container">
        <div class="box" id="box-2"></div>
        <div class="box" id="box-3"></div>
        <div class="box" id="box-4"></div>
    </div>

        
    </div>
</body>
</html>
