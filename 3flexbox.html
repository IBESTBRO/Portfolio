<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container{
            display: flex;
        }

        .box{
            margin: 20px;
            height: 400px;
            width: 100%;
        }
        

        #box-1{
            background-color: blue;
            margin: 20px;
            height: 200px;
            width: 100%;
        }

        #box-2{
            background-color: rgb(63, 113, 52);
            margin: 20px;
            height: 400px;
            width: 100%;
        }

        #box-3{
            background-color: rgb(129, 181, 117);
            margin: 20px;
            height: 400px;
            width: 100%;
        }

        #box-4{
            background-color: rgb(12, 44, 5);
            margin: 20px;
            height: 400px;
            width: 100%;
        }
        img{
            display: flex;
            width: 100%;
            height: 400px;
            
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box-1"></div>
        
    </div>
    <div class="container">
        <div class="box" id="box-">
            <img src="images/css-pattern2.png" alt="">
        </div>
        <div class="box" id="box-">
            <img src="images/css-pattern2.png" alt="">
        </div>
        <div class="box" id="box-">
            <img src="images/css-pattern2.png" alt="">
        </div>
    </div>
    <div class="container">
        <div class="box" id="box-2"></div>
        <div class="box" id="box-3"></div>
        <div class="box" id="box-4"></div>
    </div>
    
</body>
</html>
